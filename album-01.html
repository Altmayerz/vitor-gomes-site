<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Álbum 01 | Vitor Gomes Fotografia</title><style>
:root{--sand:#e9dfd0;--silver:#c5c8c9;--ink:#303235;--champagne:#b6a48b}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh;background-color:#e8e2d9;background-image:radial-gradient(ellipse 65% 45% at 4% 12%,rgba(255,250,241,.94),transparent 85%),radial-gradient(ellipse 62% 50% at 96% 28%,rgba(178,185,188,.55),transparent 78%),radial-gradient(ellipse 80% 50% at 15% 85%,rgba(201,193,181,.58),transparent 80%),linear-gradient(125deg,#eae1d4 0%,#d5d6d5 36%,#eee5d8 66%,#c3c7c8 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.28;background:repeating-linear-gradient(132deg,transparent 0,transparent 155px,rgba(255,255,255,.36) 156px,transparent 158px,transparent 290px)}
body>header,body>nav,body>section,body>main{position:relative;z-index:1}
.album-header{background:rgba(232,222,207,.92);border-bottom:1px solid rgba(117,112,105,.22);text-align:center;padding:16px 18px;backdrop-filter:blur(12px)}
.album-header img{width:min(210px,65vw);height:auto;display:block;margin:auto}
.album-nav{display:flex;justify-content:space-between;gap:16px;align-items:center;max-width:1160px;margin:0 auto;padding:25px 22px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#686a69}
.album-nav a{color:#454544;text-decoration:none;border-bottom:1px solid rgba(69,69,68,.35);padding-bottom:5px;transition:color .25s,border-color .25s}
.album-nav a:hover{color:#9a8062;border-color:#9a8062}
.album-intro{text-align:center;padding:38px 18px 54px}
.album-intro:before{content:"";display:block;width:46px;height:1px;background:#a68f74;margin:0 auto 27px}
.album-intro h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(30px,4vw,52px);letter-spacing:.075em;margin:0 0 15px;color:#303235}
.album-intro p{color:#666665;font-size:12px;letter-spacing:.16em;text-transform:uppercase;line-height:1.8}
.album-grid{max-width:1160px;margin:0 auto;padding:0 22px 90px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.album-grid button{display:block;padding:8px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.6);cursor:zoom-in;box-shadow:0 10px 35px rgba(52,51,49,.09);transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease}
.album-grid button:hover{transform:translateY(-5px);box-shadow:0 18px 45px rgba(52,51,49,.17);border-color:rgba(169,146,113,.7)}
.album-grid img{display:block;width:100%;height:auto;border-radius:0}
.lightbox{position:fixed;inset:0;background:rgba(25,26,28,.96);z-index:999;display:none;align-items:center;justify-content:center;padding:55px 55px;box-sizing:border-box}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox button{position:absolute;border:1px solid rgba(232,222,207,.4);background:rgba(225,218,207,.13);color:#f3ece3;font-size:25px;cursor:pointer;padding:9px 16px;transition:background .2s}
.lightbox button:hover{background:rgba(225,218,207,.28)}
.lightbox .close{top:12px;right:16px}.lightbox .prev{left:8px}.lightbox .next{right:8px}
.lightbox .counter{position:absolute;bottom:13px;color:#e8dfd0;font-size:13px}
@media(max-width:650px){body{background-attachment:scroll}.album-nav{font-size:10px;padding:20px 16px}.album-intro{padding:30px 16px 42px}.album-grid{grid-template-columns:1fr;padding:0 14px 60px;gap:16px}.album-grid button{padding:5px}.lightbox{padding:55px 35px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><header class="album-header"><a href="index.html"><img src="assets/img/vitor-logo-oficial.png" alt="Vitor Gomes Fotografia"></a></header><nav class="album-nav"><a href="index.html#trabalhos">Trabalhos recentes</a><span>Álbum 01 · 3 fotos</span></nav><section class="album-intro"><h1>ENSAIO FOTOGRÁFICO</h1><p>Ensaio Fotográfico · Retrato · Ibirubá</p></section><main class="album-grid"><button type="button" data-index="0" aria-label="Ampliar fotografia 1"><img loading="lazy" src="assets/img/album-01/foto-01.png" alt="Fotografia 1 do álbum 01"></button><button type="button" data-index="1" aria-label="Ampliar fotografia 2"><img loading="lazy" src="assets/img/album-01/foto-02.png" alt="Fotografia 2 do álbum 01"></button><button type="button" data-index="2" aria-label="Ampliar fotografia 3"><img loading="lazy" src="assets/img/album-01/foto-03.png" alt="Fotografia 3 do álbum 01"></button></main><div class="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de fotografias"><button class="close" aria-label="Fechar">×</button><img alt="Fotografia ampliada"><span class="counter"></span></div><script>const imgs=[...document.querySelectorAll('.album-grid img')];const box=document.querySelector('.lightbox'),large=box.querySelector('img');let current=0;function show(i){current=(i+imgs.length)%imgs.length;large.src=imgs[current].src;large.alt=imgs[current].alt;box.querySelector('.counter').textContent=(current+1)+' / '+imgs.length;}document.querySelectorAll('.album-grid button').forEach((b,i)=>b.addEventListener('click',()=>{show(i);box.classList.add('open');box.querySelector('.close').focus();}));function close(){box.classList.remove('open');large.removeAttribute('src');}box.querySelector('.close').onclick=close;box.addEventListener('click',e=>{if(e.target===box)close();});let touchX=null;box.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;},{passive:true});box.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>55)show(current+(dx<0?1:-1));},{passive:true});document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);});</script></body></html>
